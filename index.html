<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickCart AI Order Bot</title>
    <meta name="description" content="Multimodal AI grocery order bot that turns handwritten lists, receipts, and Pidgin/English messy texts into confirmed shopping carts instantly." />
    <meta property="og:title" content="QuickCart AI Order Bot" />
    <meta property="og:description" content="Multimodal AI grocery order bot that turns handwritten lists, receipts, and Pidgin/English messy texts into confirmed shopping carts instantly." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress unhandled errors from third-party browser extensions (e.g. Talisman wallet, MetaMask)
      (function() {
        function isExtensionError(msg, file, stack) {
          var text = (msg || '') + ' ' + (file || '') + ' ' + (stack || '');
          return text.indexOf('chrome-extension://') !== -1 ||
                 text.indexOf('moz-extension://') !== -1 ||
                 text.indexOf('fijngjgcjhjmmpcmkeiomlglpeiijkld') !== -1 ||
                 text.indexOf('Talisman') !== -1;
        }

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename, e.error && e.error.stack)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          var msg = r ? (r.message || r.stack || String(r)) : '';
          if (isExtensionError(msg, '', '')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
